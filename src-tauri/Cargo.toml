[package]
name = "youterm"
version = "0.2.5"
description = "YouTerm - High-performance YouTube Music desktop player (Tauri v2 + Rust)"
authors = ["YouTerm"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2.0", features = ["tray-icon"] }

# Async HTTP Server (Axum + Tokio)
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-util = "0.3"
bytes = "1.7"

# High-performance HTTP/2 Client (InnerTube, Audio Streaming, OAuth)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies", "gzip", "brotli"] }

# Fast JSON Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# System & Utilities
directories = "5.0"
regex = "1.11"
url = "2.5"
rand = "0.8"
dotenvy = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
